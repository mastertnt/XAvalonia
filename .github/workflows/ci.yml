name: CI

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [master]

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AvaloniaShell.slnx

      - name: Build
        run: dotnet build AvaloniaShell.slnx --no-restore -c Release

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack AvaloniaShell.slnx --no-build -c Release -o ./nupkg -p:Version=${{ github.ref_name }}

      - name: Upload packages as artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.ref_name }}
          path: ./nupkg/

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TOKEN=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.nuget.org" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          # Print JWT claims so we can compare with NuGet Trusted Publisher config
          echo "=== OIDC token claims ==="
          python -c "
          import base64, json, sys
          payload = '$TOKEN'.split('.')[1]
          payload += '=' * (4 - len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          " | grep -E 'iss|aud|sub|repository|workflow|ref|environment|job_workflow'

          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$TOKEN" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
