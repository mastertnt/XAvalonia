name: CI

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [master]

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AvaloniaShell.slnx

      - name: Build
        run: dotnet build AvaloniaShell.slnx --no-restore -c Release

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack AvaloniaShell.slnx --no-build -c Release -o ./nupkg -p:Version=${{ github.ref_name }}

      - name: Upload packages as artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.ref_name }}
          path: ./nupkg/

      - name: Get OIDC token for NuGet Trusted Publishing
        if: startsWith(github.ref, 'refs/tags/')
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api.nuget.org')
            core.setOutput('token', token)

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.oidc.outputs.token }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
