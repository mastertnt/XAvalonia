name: CI

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [master]

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AvaloniaShell.slnx

      - name: Build
        run: dotnet build AvaloniaShell.slnx --no-restore -c Release

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack AvaloniaShell.slnx --no-build -c Release -o ./nupkg -p:Version=${{ github.ref_name }}

      - name: Upload packages as artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.ref_name }}
          path: ./nupkg/

      - name: Get OIDC token for NuGet Trusted Publishing
        if: startsWith(github.ref, 'refs/tags/')
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api.nuget.org')
            core.setOutput('token', token)

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          # Exchange the OIDC token for a short-lived NuGet API key
          NUGET_KEY=$(python -c "
          import urllib.request, urllib.error, json, os, sys
          req = urllib.request.Request(
              'https://api.nuget.org/v1/gettrustedpublishertoken',
              data=json.dumps({'oidcToken': os.environ['OIDC_TOKEN']}).encode(),
              headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
              method='POST'
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(json.load(r)['apiKey'])
          except urllib.error.HTTPError as e:
              print(f'Exchange failed: {e.code} {e.read().decode()}', file=sys.stderr)
              sys.exit(1)
          ")

          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
